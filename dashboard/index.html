<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animation Dashboard</title>
<style>
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6783; --line:#D3D9E4;
  --lapis:#27478A; --gold:#A87412; --goldbg:#FBF1D9; --green:#2F7A55; --greenbg:#DFF1E7;
  --bluebg:#E1E9F8; --greybg:#E6E9EF; --red:#A32A2A; --redbg:#FBE4E4;
}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;
  --bg:#0E1526; --surface:#172038; --ink:#E8ECF6; --muted:#97A3BF; --line:#2A3556;
  --lapis:#8FB0F2; --gold:#E9B94F; --goldbg:#3A2E12; --green:#6FD0A0; --greenbg:#15362A;
  --bluebg:#1E2C52; --greybg:#222C48; --red:#F19A9A; --redbg:#3B1D1D;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 64px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:24px;line-height:1.2} h2{font-size:20px}
.sub{color:var(--muted);margin:6px 0 0;max-width:68ch;font-size:14px}
.note{margin:14px 0 0;padding:10px 14px;background:var(--goldbg);border-left:4px solid var(--gold);border-radius:4px;font-size:14px;max-width:80ch}
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:0 0 10px 10px;padding:12px 16px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.bar select{font:inherit;font-size:13px;margin-top:2px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.times{display:flex;gap:22px;flex-wrap:wrap}
.act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.act input{font:inherit;font-size:14px;width:220px;max-width:100%;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.act input:focus{outline:2px solid var(--lapis);outline-offset:1px}
.act .qn{font-size:12.5px;color:var(--muted);min-width:0}
.nomatch{display:none!important}
::highlight(q){background:#f5d76e;color:#000}
@media(max-width:760px){.bar{gap:8px;padding:8px 12px}.bar h1{font-size:18px}.times{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}.times small{font-size:11px}.times b{font-size:12.5px}.act{width:100%;flex-wrap:nowrap}.act input{flex:1;width:auto;min-width:0}}
.times small{display:block;color:var(--muted);font-size:12px}
.times b{font-size:14px;font-weight:600}
.times .bad b{color:var(--red)}
button.r{font:inherit;font-weight:600;padding:8px 18px;border-radius:8px;border:0;background:var(--lapis);color:#fff;cursor:pointer}
@media (prefers-color-scheme: dark){button.r{color:#0E1526}}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--lapis);outline-offset:2px}
.warn{margin-top:12px;padding:12px 16px;border-radius:8px;background:var(--redbg);border-left:4px solid var(--red);font-size:14px}
.warn.infoonly{background:var(--goldbg);border-left-color:var(--gold)}
.warn>b{color:var(--red)} .warn.infoonly>b{color:var(--gold)}
.warn ul{margin:6px 0 0;padding-left:18px} .warn li{margin:3px 0}
.warn small{color:var(--muted);display:block;margin-top:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-top:16px}
.panel h2{margin-bottom:10px}
.panel h2 small{font-family:inherit;font-weight:400;color:var(--muted);font-size:13px}
.chg{list-style:none;margin:0;padding:0;font-size:14px}
.chg li{padding:6px 0;border-top:1px solid var(--line)} .chg li:first-child{border-top:0}
.tag{display:inline-block;min-width:78px;font-weight:600;font-size:12.5px;padding:1px 8px;border-radius:999px;margin-right:8px;text-align:center}
.tag.added{background:var(--greenbg);color:var(--green)} .tag.removed{background:var(--redbg);color:var(--red)}
.tag.other{background:var(--bluebg);color:var(--lapis)}
.btn2{font:inherit;font-size:13px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.muted{color:var(--muted)}
.top{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:16px}
@media(max-width:820px){.top{grid-template-columns:1fr}}
.top .panel{margin-top:0}
.next ul{list-style:none;margin:0;padding:0}
.next li{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.next li:first-child{border-top:0}
.next .d{font-weight:600;color:var(--gold)} .next .t{font-weight:500}
.next .t a{color:var(--lapis);text-decoration:underline;text-underline-offset:3px}
.next .o{color:var(--muted);font-size:13px}
.meter{display:flex;gap:4px;margin:6px 0 14px}
.meter span{flex:1;height:10px;border-radius:3px;background:var(--greybg)}
.meter span.done{background:var(--green)} .meter span.doing{background:var(--lapis)} .meter span.waiting{background:var(--gold)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0}
.kpis dt{font-size:13px;color:var(--muted)} .kpis dd{margin:0;font-weight:600}
.kpis dd a.sub{display:block;font-weight:400;font-size:13px;margin-top:2px}
.owners{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px}
.owners caption{text-align:left;font-size:13px;color:var(--muted);padding-bottom:4px}
.owners th,.owners td{padding:5px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.owners th:first-child,.owners td:first-child{text-align:left}
.owners thead th{font-size:12.5px;color:var(--muted);font-weight:600;border-top:0}
.owners td.share{width:34%}
.owners .sh{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--greybg)}
.owners .sh i{display:block;height:100%}.owners .sh .d{background:var(--green)}.owners .sh .o{background:var(--gold)}
.strip{display:flex;gap:8px;margin:22px 0 8px;overflow-x:auto;padding-bottom:6px}
.strip a{flex:1 0 140px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-top-width:5px;border-radius:8px;padding:10px 12px}
.strip a.done{border-top-color:var(--green)} .strip a.doing{border-top-color:var(--lapis)}
.strip a.waiting{border-top-color:var(--gold)} .strip a.todo{border-top-color:var(--line)}
.strip b{display:block;font-size:14px} .strip small{color:var(--muted);display:block}
.strip em{font-style:normal;font-size:12px;font-weight:600}
.filters{display:flex;gap:8px;align-items:center;margin:22px 0 6px;flex-wrap:wrap}
.filters span{color:var(--muted);font-size:14px;margin-right:4px}
.filters button{font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--lapis);color:#fff;border-color:var(--lapis)}
@media (prefers-color-scheme: dark){.filters button[aria-pressed="true"]{color:#0E1526}}
.gate{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:18px;overflow:hidden}
.gate>summary{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.gate:not([open])>summary{border-bottom:0}
.fold>summary{cursor:pointer;list-style:none}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary h2::before{content:"\25B8";display:inline-block;width:1.1em;color:var(--muted);transition:transform .15s}
.fold[open]>summary h2::before{transform:rotate(90deg)}
.panel.fold:not([open])>summary h2{margin-bottom:0}
.filters .sep{flex:1}
.gate .dates{color:var(--muted);font-size:14px;margin-top:2px}
.goal{padding:14px 20px;display:grid;grid-template-columns:90px 1fr;gap:6px 12px;background:var(--bg);font-size:14px;margin:0}
.goal dt{color:var(--muted);font-weight:600} .goal dd{margin:0}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.done{background:var(--greenbg);color:var(--green)} .chip.doing{background:var(--bluebg);color:var(--lapis)}
.chip.waiting{background:var(--goldbg);color:var(--gold)} .chip.todo{background:var(--greybg);color:var(--muted)}
.chip.unconfirmed{background:var(--greybg);color:var(--ink);border:1px dashed var(--muted)}
.own{font-weight:600} .own.reza{color:var(--gold)} .own.claude{color:var(--lapis)} .own.both{color:var(--ink)}
.tasks{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:52px minmax(0,2.3fr) 76px 92px 130px minmax(0,1.6fr);gap:12px;padding:12px 20px;border-top:1px solid var(--line);align-items:start}
.row.head{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--surface)}
.row .ord{color:var(--muted);font-variant-numeric:tabular-nums} .row .name{font-weight:500} .row .out{color:var(--muted);font-size:14px}
.row .name a{color:var(--lapis);text-decoration:underline;text-underline-offset:3px}
.row .min{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.row .tid{color:var(--muted);font-size:12px;font-weight:400;margin-right:6px}
.row.hide{display:none}
@media(max-width:760px){.row{grid-template-columns:1fr auto;gap:4px 10px}.row.head{display:none}.row .name,.row .out,.row .ord{grid-column:1/3}.row .ord{font-size:12.5px}.row .ord:not(:empty)::before{content:"Order "}}
.stand ul{margin:0;padding:0;list-style:none}
.stand li{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.stand li:first-child{border-top:0}
.tot{display:flex;gap:28px;margin:4px 0 14px;flex-wrap:wrap}
.tot small{display:block;color:var(--muted);font-size:12.5px} .tot b{font-size:22px;font-family:Georgia,serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface)}
.card b{display:block} .card .m{color:var(--muted);font-size:12.5px;display:block}
.bar2{height:8px;background:var(--greybg);border-radius:4px;margin:8px 0 4px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--lapis)}
.old{color:var(--gold);font-weight:600}
.err{margin:40px 0;padding:16px;border-radius:8px;background:var(--redbg);color:var(--red)}
.foot{margin-top:28px;color:var(--muted);font-size:13px;max-width:80ch}
</style></head><body>
<div class="wrap">
  <div class="bar" id="bar" role="banner"></div>
  <div id="app"><p class="muted" style="margin-top:30px">Loading…</p></div>
</div>
<script>
const LABEL={done:"Done",doing:"In progress",waiting:"Waiting on Reza",todo:"Not started",unconfirmed:"Unconfirmed, tell Claude"};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtT=s=>{if(!s)return"unknown";const d=new Date(s);if(isNaN(d))return esc(s);
  return d.toLocaleString("en-US",{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})};
const chip=s=>`<span class="chip ${esc(s)}">${esc(LABEL[s]||s)}</span>`;
const owner=o=>`<span class="own ${esc(String(o).toLowerCase())}">${esc(o)}</span>`;
const money=n=>"$"+Number(n).toFixed(2);
const splitSpend=s=>{const b=(s.by_person||[]).filter(x=>x.rows>0);return b.length>1?`<span class="sub">${b.map(x=>esc(x.person.charAt(0).toUpperCase()+x.person.slice(1))+" "+money(x.usd)).join(" · ")}</span>`:""};
function gateStatus(g){const st=g.tasks.map(t=>t.s);if(st.every(x=>x==="done"))return"done";if(st.includes("waiting"))return"waiting";if(st.includes("done")||st.includes("doing")||st.includes("unconfirmed"))return"doing";return"todo"}
let FILM=null, FILTER="all", openWarn=false, Q="";
const OPEN={};  // sections the user opened or closed, kept across Refresh until the app closes
const isOpen=(k,dflt)=>k in OPEN?OPEN[k]:dflt;
const gateKey=g=>FILM+"/"+g.id;

async function load(){
  try{
    const r=await fetch("/api/data"+(FILM?("?film="+encodeURIComponent(FILM)):""),{cache:"no-store"});
    const d=await r.json();
    if(!r.ok||d.error)throw new Error(d.error||r.statusText);
    FILM=d.film; render(d);
  }catch(e){
    $("app").innerHTML=`<div class="err"><b>Could not read the project files.</b><br>${esc(e.message)}<br>Check that the Persian Stories folder is where the app expects it, then press Refresh.</div>`;
    renderBar(null);
  }
}
function renderBar(d){
  const t=d&&d.times;
  $("bar").innerHTML=`<div><h1>Animation Dashboard</h1><small class="muted">Film: ${d?`<select id="filmSel" aria-label="Film">${d.films.map(f=>`<option ${f===d.film?"selected":""}>${esc(f)}</option>`).join("")}</select>`:"—"}</small></div>
  <div class="times">
    <div><small>Dashboard refreshed</small><b>${t?fmtT(t.refreshed):"—"}</b></div>
    <div class="${t&&t.stamp_mismatch?"bad":""}"><small>Plan stamped (inside plan.json)</small><b>${t?fmtT(t.plan_stamped):"—"}</b></div>
    <div><small>Plan file saved on Mac</small><b>${t?fmtT(t.plan_saved):"—"}</b></div>
    <div><small>Newest project file change</small><b>${t&&t.newest_file?fmtT(t.newest_file)+" · "+esc(t.newest_file_name):"—"}</b></div>
  </div><div class="act" role="search"><input type="search" id="q" placeholder="Search the dashboard" aria-label="Search the dashboard" value="${esc(Q)}" autocomplete="off" spellcheck="false"><span class="qn" id="qn" aria-live="polite"></span><button class="r" id="refresh">Refresh</button></div>`;
  $("refresh").onclick=async e=>{e.target.textContent="Refreshing…";await load();};
  const s=$("filmSel"); if(s) s.onchange=()=>{FILM=s.value;load()};
  const q=$("q"); q.oninput=()=>{Q=q.value;applySearch()};
  q.onkeydown=e=>{if(e.key==="Escape"){q.value=Q="";applySearch()}};
}
function renderWarnings(ws){
  if(!ws.length)return `<div class="warn infoonly" style="background:var(--greenbg);border-left-color:var(--green)"><b style="color:var(--green)">No warnings.</b> The plan matches film.yaml, the cost log and the files on disk.</div>`;
  const hard=ws.some(w=>w.level==="warn");
  return `<div class="warn ${hard?"":"infoonly"}" role="alert"><b>${ws.length} thing${ws.length>1?"s":""} need${ws.length>1?"":"s"} attention</b><ul>${ws.map(w=>`<li><b>${esc(w.title)}.</b> ${esc(w.detail)}</li>`).join("")}</ul><small>The app only reports these. It never edits files.</small></div>`;
}
function changeList(c){
  if(!c)return"";
  if(c.first_run)return `<p class="muted" style="margin:0">First time opened: nothing to compare yet. Changes will show here after the next plan update.</p>`;
  if(!c.items.length)return `<p class="muted" style="margin:0">No changes (${esc(c.from_version)} → ${esc(c.to_version)}).</p>`;
  const label={added:"Added",removed:"Removed",status:"Status","due date":"Due date",owner:"Owner",renamed:"Renamed"};
  return `<ul class="chg">${c.items.map(i=>`<li><span class="tag ${i.kind==="added"?"added":i.kind==="removed"?"removed":"other"}">${esc(label[i.kind]||i.kind)}</span><b>${esc(i.gate)}</b> · ${esc(i.task)}${i.detail?` <span class="muted">· ${esc(i.detail)}</span>`:""}</li>`).join("")}</ul>`;
}
function renderSubs(s){
  const cards=s.cards.map(c=>{
    const dd=s=>{const d=new Date(s+"T12:00:00");return isNaN(d)?esc(s):d.toLocaleDateString("en-US",{month:"short",day:"numeric"})};
    const price=c.type==="prepaid"?"No monthly charge":(c.trial?`Free until ${dd(c.next_charge)}, then ${money(c.price)}/month`:`${money(c.price)}/month${c.next_charge?" · next charge "+dd(c.next_charge):""}`);
    const usd=c.unit==="USD";const fm=n=>usd?"$"+Number(n).toLocaleString():Number(n).toLocaleString();
    let bar="";
    if(c.total!=null&&(c.used!=null||c.left!=null)){const used=c.used!=null?c.used:c.total-c.left;const left=c.left!=null?c.left:c.total-c.used;
      bar=`<div class="bar2" aria-hidden="true"><i style="width:${Math.max(0,Math.min(100,100*left/c.total))}%"></i></div><span class="m">${fm(left)} of ${fm(c.total)}${usd?"":" "+esc(c.unit)} left</span>`;
    }else if(c.left!=null){bar=`<span class="m">${fm(c.left)}${usd?"":" "+esc(c.unit)} left</span>`}
    const hk=String(c.how_known||"");
    const how=/^AUTOMATIC/i.test(hk)?"Read from the vendor's API":/^Reza-stated/i.test(hk)?"Stated by Reza":hk.split(/[.;]/)[0].slice(0,60);
    return `<div class="card"><b>${esc(c.vendor)}${c.plan&&!/prepaid/i.test(c.plan)?" "+esc(String(c.plan).replace(/\s*\(.*\)/,"")):""}</b><span class="m">${price}</span>${bar}<span class="m">${esc(how)}${c.as_of?" · as of "+esc(c.as_of):""}${c.stale?` · <span class="old">balance is old (${c.age_days} days)</span>`:""}</span></div>`;
  }).join("");
  return `<details class="panel fold" data-k="subs"${isOpen("subs",false)?" open":""}><summary><h2>Subscriptions and credits</h2></summary><div class="tot"><div><small>Monthly total, charging now</small><b>${money(s.monthly_now)}</b></div>${s.monthly_later!=null?`<div><small>From ${(()=>{const d=new Date(s.later_date+"T12:00:00");return isNaN(d)?esc(s.later_date):d.toLocaleDateString("en-US",{month:"short",day:"numeric"})})()} (adds the paid plan that starts then)</small><b>${money(s.monthly_later)}</b></div>`:""}</div><div class="grid">${cards}</div><p class="muted" style="font-size:12.5px;margin:10px 0 0">Source: ${esc(s.source)} (the current file). Sorted by next charge date.</p></details>`;
}
// Tasks per owner: Reza first, then Claude, then everyone else (e.g. "Both"); each task counted once.
function ownerTable(all){
  const by={}; all.forEach(t=>{const o=t.o||"No owner";(by[o]=by[o]||{n:0,done:0}).n++;if(t.s==="done")by[o].done++});
  const rank=o=>o==="Reza"?0:o==="Claude"?1:2;
  const names=Object.keys(by).sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b));
  return `<table class="owners"><caption>Tasks by owner (this film)</caption><thead><tr><th>Owner</th><th>All</th><th>Done</th><th>Open</th><th class="share">Share of all tasks</th></tr></thead><tbody>${names.map(o=>{const r=by[o],pct=100*r.n/all.length;
    return `<tr><td>${o==="Reza"?"Reza (you)":esc(o)}</td><td>${r.n}</td><td>${r.done}</td><td>${r.n-r.done}</td><td class="share" title="${Math.round(pct)}% of all tasks"><span class="sh" style="width:${pct}%"><i class="d" style="flex:${r.done}"></i><i class="o" style="flex:${r.n-r.done}"></i></span></td></tr>`}).join("")}</tbody></table>`;
}
function render(d){
  renderBar(d);
  const P=d.plan, stats=P.gates.map(gateStatus), all=P.gates.flatMap(g=>g.tasks), doneN=all.filter(t=>t.s==="done").length;
  const open=[]; P.gates.forEach(g=>g.tasks.forEach(t=>{if((t.o==="Reza"||t.o==="Both")&&t.s!=="done")open.push({g,t})}));
  const cs=d.changes.since_seen, cp=d.changes.vs_previous;
  const seenBtn=cs&&!cs.first_run&&cs.items.length?`<p style="margin:10px 0 0"><button class="btn2" id="seen">Mark as seen</button></p>`:"";
  const html=`
  <h1 style="margin-top:20px">${esc(d.film.replace(/^EP(\d+)_/,"EP$1 ").replace(/-/g," ").replace(/\b(\w)/g,m=>m.toUpperCase()).replace(/^Ep/,"EP").replace(/ And /g," and "))}: plan and status</h1>
  <p class="sub">Five gates take the episode from story to published film. Every task has one owner, a due date and a stated result. Plan ${esc(P.version)}.</p>
  <p class="note"><b>Publish target:</b> ${esc(P.publish)}. Dates after today are worked back from it. They move only when you and Claude decide to move them.</p>
  ${renderWarnings(d.warnings)}
  <details class="panel fold" data-k="chg"${isOpen("chg",false)?" open":""}><summary><h2>What changed since you last looked <small>${cs?`(plan ${esc(cs.from_version)} → ${esc(cs.to_version)})`:""}${cs&&!cs.first_run?` · ${cs.items.length?cs.items.length+" change"+(cs.items.length===1?"":"s"):"no changes"}`:""}</small></h2></summary>${changeList(cs)}${seenBtn}
    ${cp?`<details style="margin-top:12px"><summary class="muted" style="cursor:pointer;font-size:13.5px">Difference from the previous saved plan (${esc(cp.from_version)} → ${esc(cp.to_version)}): ${cp.items.length} item${cp.items.length===1?"":"s"}</summary><div style="margin-top:8px">${changeList(cp)}</div></details>`:""}
  </details>
  <div class="top">
    <section class="panel next"><h2>Your next actions</h2><ul>${open.slice(0,5).map(({g,t})=>`<li><span class="d">${esc(t.due)}</span><div><div class="t">${t.link?`<a href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.n)}</a>`:esc(t.n)}</div><div class="o">${esc(g.name)}${t.min?` · ${esc(t.min)}`:""}</div></div></li>`).join("")}</ul></section>
    <section class="panel"><h2>Where we are</h2><div class="meter" aria-hidden="true">${stats.map(s=>`<span class="${s}"></span>`).join("")}</div>
      <dl class="kpis"><dt>Tasks done</dt><dd>${doneN} of ${all.length}</dd><dt>Gates closed</dt><dd>${P.gates.filter((g,i)=>stats[i]==="done").length} of ${P.gates.length}</dd><dt>Open on Reza</dt><dd>${all.filter(t=>t.o==="Reza"&&t.s!=="done").length}</dd><dt>Open on Claude</dt><dd>${all.filter(t=>t.o==="Claude"&&t.s!=="done").length}</dd><dt>Publish target</dt><dd>${esc(P.publish)}</dd><dt>Spend</dt><dd>${d.spend?`${money(d.spend.total_usd)}${splitSpend(d.spend)}<a class="sub" id="costlog" href="/cost-log.csv" target="_blank" rel="noopener">cost-log.csv (${d.spend.rows} entr${d.spend.rows===1?"y":"ies"})</a>`:esc(P.spend)}</dd></dl>${ownerTable(all)}</section>
  </div>
  <nav class="strip" aria-label="Gates">${P.gates.map((g,i)=>`<a href="#${esc(g.id)}" class="${stats[i]}"><b>${esc(g.name.replace(/^(Gate \d: |Milestone: )/,""))}</b><small>${g.id==="IB"||g.id==="PUB"?"Milestone":esc(g.name.split(":")[0])}</small><em>${LABEL[stats[i]]}</em></a>`).join("")}</nav>
  <div class="filters" role="group" aria-label="Show tasks for"><span>Show tasks for</span>${[["all","Everyone"],["Reza","Reza"],["Claude","Claude"]].map(([k,l])=>`<button data-f="${k}" aria-pressed="${FILTER===k}">${l}</button>`).join("")}<span class="sep"></span><button data-all="1">Open all</button><button data-all="0">Close all</button></div>
  <main>${P.gates.map((g,i)=>`<details class="gate fold" id="${esc(g.id)}" data-k="${esc(gateKey(g))}" data-dflt="${stats[i]==="done"||stats[i]==="todo"?0:1}"${isOpen(gateKey(g),!(stats[i]==="done"||stats[i]==="todo"))?" open":""}><summary><div><h2>${esc(g.name)}</h2><div class="dates">${esc(g.dates)}</div></div>${chip(stats[i])}</summary>
    <dl class="goal"><dt>Goal</dt><dd>${esc(g.goal)}</dd><dt>Done when</dt><dd>${esc(g.done)}</dd></dl>
    <ul class="tasks"><li class="row head"><span>Order</span><span>Task</span><span>Owner</span><span>Due</span><span>Status</span><span>Result when done</span></li>
    ${g.tasks.map(t=>`<li class="row ${FILTER!=="all"&&t.o!==FILTER&&t.o!=="Both"?"hide":""}" data-o="${esc(t.o)}"><span class="ord">${t.order!=null&&t.order!==""?esc(t.order):""}</span><span class="name">${t.id?`<span class="tid">${esc(t.id)}</span>`:""}${t.link?`<a href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.n)}</a>`:esc(t.n)}${t.file?`<span class="min">File: ${esc(t.file)}</span>`:""}${t.min?`<span class="min">${esc(t.min)}</span>`:""}</span>${owner(t.o)}<span class="due">${esc(t.due)}</span>${chip(t.s)}<span class="out">${esc(t.out)}</span></li>`).join("")}</ul></details>`).join("")}</main>
  ${renderSubs(d.subscriptions)}
  <details class="panel stand fold" data-k="stand" style="margin-top:22px"${isOpen("stand",false)?" open":""}><summary><h2>Standing items (not part of this film)</h2></summary><ul>${P.standing.map(s=>`<li><span>${esc(s.d)}</span><span>${esc(s.t)}</span>${owner(s.o)}</li>`).join("")}</ul></details>
  <p class="foot">Read-only. This page reads plan.json and the project files each time you press Refresh. A task name that is underlined is a link to the file you need for that task.</p>`;
  $("app").innerHTML=html;
  document.querySelectorAll(".filters button[data-f]").forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;
    document.querySelectorAll(".filters button[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b));
    document.querySelectorAll(".row[data-o]").forEach(r=>{const o=r.dataset.o;r.classList.toggle("hide",FILTER!=="all"&&o!==FILTER&&o!=="Both")});applySearch()});
  document.querySelectorAll(".fold>summary").forEach(sm=>sm.onclick=()=>{const f=sm.parentElement;OPEN[f.dataset.k]=!f.open});
  document.querySelectorAll(".filters button[data-all]").forEach(b=>b.onclick=()=>{const o=b.dataset.all==="1";
    document.querySelectorAll(".gate.fold").forEach(g=>{g.open=o;OPEN[g.dataset.k]=o})});
  document.querySelectorAll(".strip a").forEach(a=>a.onclick=()=>{const g=document.getElementById(decodeURIComponent(a.hash.slice(1)));if(g&&!g.open){g.open=true;OPEN[g.dataset.k]=true}});
  const cl=$("costlog"); if(cl) cl.onclick=async e=>{e.preventDefault();  // open in Numbers/Excel on this Mac, else show the text
    try{const r=await fetch("/api/open-cost-log",{method:"POST"});if(r.ok)return}catch(_){}
    window.open(cl.href,"_blank")};
  const sb=$("seen"); if(sb) sb.onclick=async()=>{await fetch("/api/seen?film="+encodeURIComponent(FILM),{method:"POST"});load()};
  applySearch();
}
// Search: hides task rows, standing items and cards that do not match; opens sections with a match
// (without changing what the user opened or closed); highlights every match on the page.
function applySearch(){
  const q=Q.trim().toLowerCase(), has=el=>el.textContent.toLowerCase().includes(q);
  let n=0;
  document.querySelectorAll(".gate.fold").forEach(g=>{
    const head=!!q&&has(g.querySelector("summary"))||!!q&&has(g.querySelector(".goal"));
    let hit=0;
    g.querySelectorAll(".row[data-o]").forEach(r=>{const m=!q||head||has(r);r.classList.toggle("nomatch",!m);if(q&&m&&!r.classList.contains("hide")){hit++;n++}});
    g.classList.toggle("nomatch",!!q&&!hit&&!head);
    g.open=q?(hit>0||head):isOpen(g.dataset.k,g.dataset.dflt==="1");
  });
  document.querySelectorAll(".panel.fold").forEach(p=>{
    let hit=0;
    const items=p.querySelectorAll(p.classList.contains("stand")?"li":".card");
    if(!items.length)hit=q&&has(p)?1:0;  // e.g. What changed: not filtered, just opened when it matches
    items.forEach(it=>{const m=!q||has(it);it.classList.toggle("nomatch",!m);if(q&&m)hit++});
    p.open=q?hit>0:isOpen(p.dataset.k,false);
  });
  const qn=$("qn"); if(qn) qn.textContent=q?(n?n+" task"+(n===1?"":"s"):"No tasks match"):"";
  if(window.CSS&&CSS.highlights){CSS.highlights.delete("q");if(q){const rs=[],w=document.createTreeWalker($("app"),NodeFilter.SHOW_TEXT);
    for(let t;t=w.nextNode();){const v=t.nodeValue.toLowerCase();for(let i=v.indexOf(q);i>=0;i=v.indexOf(q,i+q.length)){const r=new Range();r.setStart(t,i);r.setEnd(t,i+q.length);rs.push(r)}}
    if(rs.length)CSS.highlights.set("q",new Highlight(...rs))}}
}
document.addEventListener("keydown",e=>{if(window.pywebview&&(e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="f"){e.preventDefault();const q=$("q");if(q){q.focus();q.select()}}});
load();
</script></body></html>
